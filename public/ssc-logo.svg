  <!-- Caduceus Staff -->
  <rect x="94" y="30" width="12" height="70" fill="#0F4C81" rx="6"/>
  <circle cx="100" cy="22" r="10" fill="#0F4C81"/>
  
  <!-- Wings -->
  <path d="M 94,45 Q 40,25 45,65 Q 75,70 94,55" fill="#0F4C81"/>
  <path d="M 106,45 Q 160,25 155,65 Q 125,70 106,55" fill="#0F4C81"/>
  
  <!-- Snakes -->
